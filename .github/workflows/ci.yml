name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install pytest ruff
      - run: python -m ruff check .
      - run: python -m pytest -q --ignore=tests/test_powershell.py

  powershell:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Verify wrappers in hosted PowerShell
        shell: pwsh
        env:
          FORTIGATE_REQUIRE_PWSH: '1'
        run: |
          $PSVersionTable.PSVersion
          python -m pytest -q tests/test_powershell.py
          exit $LASTEXITCODE
